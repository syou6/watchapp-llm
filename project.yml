# XcodeGen spec — generates WatchVoiceLLM.xcodeproj
#
#   brew install xcodegen
#   xcodegen generate
#   open WatchVoiceLLM.xcodeproj
#
# Text-defined so the project is reviewable in git and reproducible.
# Bump DEVELOPMENT_TEAM / bundle ids for your own signing before running on device.

name: WatchVoiceLLM

options:
  bundleIdPrefix: com.example.watchvoicellm
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    # DEVELOPMENT_TEAM: XXXXXXXXXX   # <- set your team id to run on device
    GENERATE_INFOPLIST_FILE: NO

targets:

  # ─────────────────────────── iPhone: the brain ───────────────────────────
  WatchVoiceLLM:
    type: application
    platform: iOS
    sources:
      - path: iOS/Sources
      - path: Shared/Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.watchvoicellm
        INFOPLIST_FILE: iOS/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: iOS/Resources/iOS.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
    dependencies:
      - target: WatchVoiceLLM-Watch
      # ── Heavy on-device backends: OFF by default for a fast first build. ──
      # Uncomment these three + the `packages:` block at the bottom to activate
      # WhisperKit (STT) and MLX/Qwen (LLM). The code auto-detects them via
      # #if canImport(...); with them off you get SFSpeechRecognizer + Foundation
      # Models (falling back to Echo), which builds in seconds on any iPhone.
      # - package: WhisperKit
      # - package: mlx-swift-lm
      #   product: MLXLLM
      # - package: mlx-swift-lm
      #   product: MLXLMCommon

  # ─────────────────────── Apple Watch: capture client ─────────────────────
  WatchVoiceLLM-Watch:
    type: application
    platform: watchOS
    sources:
      - path: Watch/Sources
      - path: Shared/Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.watchvoicellm.watchkitapp
        INFOPLIST_FILE: Watch/Resources/Info.plist
        WKCompanionAppBundleIdentifier: com.example.watchvoicellm
        WKRunsIndependentlyOfCompanionApp: NO

# ── Heavy on-device backends (OFF by default) ──
# Uncomment this block AND the matching `dependencies` entries above to activate
# WhisperKit (STT) and MLX/Qwen (LLM). Heads up: the first build resolves large
# Swift packages and the model weights download at runtime (Qwen3-4B-4bit is
# ~2.3 GB), so real-device is recommended for this path.
#
# packages:
#   WhisperKit:
#     url: https://github.com/argmaxinc/WhisperKit
#     from: "0.9.0"
#   mlx-swift-lm:
#     url: https://github.com/ml-explore/mlx-swift-lm
#     branch: main
